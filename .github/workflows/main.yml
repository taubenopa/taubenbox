name: Tauben-Box bauen

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Konfigurieren
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Bauen (Release)
        run: cmake --build build --config Release --parallel

      - name: Version bestimmen
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.1.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Inno Setup installieren
        run: choco install innosetup -y --no-progress

      - name: Installer bauen
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.ver.outputs.version }}" TaubenBox.iss

      - name: VST3 als ZIP packen
        shell: pwsh
        run: |
          Compress-Archive -Path "build\TaubenBox_artefacts\Release\VST3\Tauben-Box.vst3" -DestinationPath "Tauben-Box-VST3.zip"

      - name: Installer hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Tauben-Box-Installer
          path: Output/*.exe

      - name: VST3-ZIP hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Tauben-Box-VST3
          path: Tauben-Box-VST3.zip

      - name: GitHub Release (bei Tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Output/*.exe
            Tauben-Box-VST3.zip
